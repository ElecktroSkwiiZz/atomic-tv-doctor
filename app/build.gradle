plugins { id 'com.android.application' }

android {
    namespace 'com.jbatomic.tvdoctor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jbatomic.tvdoctor'
        minSdk 26
        targetSdk 35
        versionCode 10200
        versionName '1.2.0'
        buildConfigField "String", "GITHUB_REPOSITORY", '"ElecktroSkwiiZz/atomic-tv-doctor"'
    }

    signingConfigs {
        release {
            def path = project.findProperty('DOCTOR_KEYSTORE')
            if (path) {
                storeFile file(path)
                storePassword project.findProperty('DOCTOR_STORE_PASSWORD') ?: ''
                keyAlias project.findProperty('DOCTOR_KEY_ALIAS') ?: ''
                keyPassword project.findProperty('DOCTOR_KEY_PASSWORD') ?: ''
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.findProperty('DOCTOR_KEYSTORE')) signingConfig signingConfigs.release
        }
        debug { applicationIdSuffix '.debug' }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
